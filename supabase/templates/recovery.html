<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#edf2f4;font-family:Arial,sans-serif;color:#173747">
    <div style="max-width:560px;margin:32px auto;background:#ffffff;border:1px solid #d6e0e5;border-radius:12px;overflow:hidden">
      <div style="background:#102d3f;padding:24px 32px;color:#ffffff">
        <strong style="font-size:22px">Mundo Ar</strong>
        <div style="margin-top:4px;color:#66d2c9;font-size:12px;letter-spacing:1.5px;text-transform:uppercase">Climatização automotiva</div>
      </div>
      <div style="padding:32px">
        <h1 style="margin:0 0 16px;font-size:24px">Redefinição de senha</h1>
        <p style="line-height:1.6">Recebemos uma solicitação para alterar a senha da sua conta.</p>
        <p style="margin:28px 0">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/atualizar-senha" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:bold;padding:13px 20px;border-radius:8px">Criar uma nova senha</a>
        </p>
        <p style="font-size:13px;line-height:1.5;color:#607582">Se você não solicitou a alteração, ignore este e-mail. Sua senha atual continuará válida.</p>
      </div>
    </div>
  </body>
</html>
